name: android-release

# 小满树洞 0.6.0 · Release 出包（签名只在云端做）
# 触发：手动 / 打 v* tag。与 android.yml（日常 debug 出包）分开，不互相影响。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   ANDROID_KEYSTORE_B64        base64 -w0 的 release keystore（单行）
#   ANDROID_KEYSTORE_PASSWORD   store 密码
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key 密码
# 生成脚本：bash scripts/gen_release_keystore.sh（产物只写在仓库外 ~/.secrets）
#
# 未配置 secrets 时：仍产出 unsigned APK 作为可复现构建证据，摘要明确标 signed=NO。
#
# Artifact 命名：xiaoman-treehole-release-0.6.0-<commit 短 sha>；release 产物保留 30 天
# （普通 CI 产物统一 7 天，release 包需长期留档，这是唯一例外，见 docs/ci-workflows.md §7）。

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx2g"
  # 版本号单一真源在 android/app/build.gradle.kts；这里只用于摘要/断言，避免两处漂移
  EXPECTED_VERSION_CODE: "6"
  EXPECTED_VERSION_NAME: "0.6.0"
  EXPECTED_PACKAGE: "com.xiaoman.treehole"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Short sha
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Android SDK components
        # 不缓存 SDK（runner 自带，且 hostedtoolcache 路径不是 SDK 实际安装位）；
        # 动态定位 sdkmanager：cmdline-tools 16 起布局变化，写死 latest 路径会踩空。
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          [ -x "$SDKMANAGER" ] || { echo "未找到 sdkmanager（ANDROID_HOME=$ANDROID_HOME）"; ls "$ANDROID_HOME"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "签名材料齐全：将产出 signed release APK"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置签名 secrets，本次只产出 unsigned APK（不可用于正式分发）"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/release.keystore" || { echo "keystore 解码为空"; exit 1; }

      - name: Sync web assets into android assets/www
        run: bash scripts/build_assets.sh

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease --no-daemon

      - name: Collect APK
        id: collect
        run: |
          set -e
          OUT=android/app/build/outputs/apk/release
          APK=$(ls "$OUT"/app-release.apk 2>/dev/null || true)
          SIGNED=yes
          if [ -z "$APK" ]; then
            APK=$(ls "$OUT"/app-release-unsigned.apk 2>/dev/null || true)
            SIGNED=no
          fi
          [ -n "$APK" ] || { echo "未找到 release APK"; ls -la "$OUT" || true; exit 1; }
          mkdir -p dist
          NAME="xiaoman-treehole-${EXPECTED_VERSION_NAME}-${SIGNED}-${{ steps.meta.outputs.short }}.apk"
          cp "$APK" "dist/$NAME"
          echo "apk=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -l "dist/$NAME"

      - name: Verify signature (signed only)
        if: steps.collect.outputs.signed == 'yes'
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs "${{ steps.collect.outputs.apk }}" \
            | tee dist/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/verify.txt
          "$BT/zipalign" -c -v 4 "${{ steps.collect.outputs.apk }}" | tail -3 | tee -a dist/verify.txt

      - name: Badging + size + sha256
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK="${{ steps.collect.outputs.apk }}"
          "$BT/aapt2" dump badging "$APK" > dist/badging.txt
          head -3 dist/badging.txt
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "apk=$APK"
            echo "signed=${{ steps.collect.outputs.signed }}"
            echo "size_bytes=$SIZE"
            echo "size_mb=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")"
            echo "sha256=$SHA"
          } | tee dist/RELEASE_INFO.txt
          C=$(grep -i "certificate SHA-256" dist/verify.txt | head -1 || true)
          {
            echo "### android-release ${EXPECTED_VERSION_NAME}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 签名 | ${{ steps.collect.outputs.signed }} |"
            echo "| 体积 | ${SIZE} 字节 / $(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}") MB |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| 证书 | ${C:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert version and package
        # 真断言：版本号/包名与单一真源不一致就红，不让"跑通但发错版本"过关
        run: |
          set -e
          grep -q "package: name='${EXPECTED_PACKAGE}'" dist/badging.txt \
            || { echo "FAIL package 不是 ${EXPECTED_PACKAGE}"; head -3 dist/badging.txt; exit 1; }
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" dist/badging.txt \
            || { echo "FAIL versionCode 不是 ${EXPECTED_VERSION_CODE}"; head -3 dist/badging.txt; exit 1; }
          grep -q "versionName='${EXPECTED_VERSION_NAME}'" dist/badging.txt \
            || { echo "FAIL versionName 不是 ${EXPECTED_VERSION_NAME}"; head -3 dist/badging.txt; exit 1; }
          if [ "${{ steps.signing.outputs.present }}" = "true" ]; then
            [ "${{ steps.collect.outputs.signed }}" = "yes" ] || { echo "FAIL 有 secrets 但产出的是 unsigned APK"; exit 1; }
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/verify.txt \
              || { echo "FAIL APK v2 签名校验未通过"; exit 1; }
          else
            echo "::warning::未配置签名 secrets，仅校验版本与包名"
          fi
          echo "version/package 断言通过"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoman-treehole-release-0.6.0-${{ steps.meta.outputs.short }}
          path: |
            dist/*.apk
            dist/RELEASE_INFO.txt
            dist/verify.txt
            dist/badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
