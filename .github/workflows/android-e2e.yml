name: android-e2e

# 端到端真机走查（云端 AVD）：六态截图 + 实测值 + 归因数据。
# 只手动触发。产出 artifact: android-e2e-walk（e2e_*.png + e2e_walk_metrics.json）。
# 纪律：本机不起浏览器/模拟器，全部在 runner 上跑。

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  e2e-walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Sync web assets + build debug APK
        run: |
          bash scripts/build_assets.sh
          (cd android && ./gradlew assembleDebug --no-daemon)
          APK=$(find android -name "*.apk" -path "*debug*" | head -1)
          [ -n "$APK" ] || { echo "no debug APK"; exit 1; }
          echo "APK_PATH=$PWD/$APK" >> "$GITHUB_ENV"
          echo "APK=$APK"

      - name: Generate TTS fixture WAV (2.2s, 6 音节段)
        run: |
          python3 - <<'PY'
          import math, wave
          rate, rate_ms = 22050, 22050
          segs = [(0.30, 0.80), (0.06, 0.0), (0.26, 0.55), (0.06, 0.0),
                  (0.30, 0.95), (0.06, 0.0), (0.24, 0.60), (0.06, 0.0),
                  (0.30, 0.85), (0.06, 0.0), (0.28, 0.70), (0.32, 0.0)]
          frames = []
          for dur, amp in segs:
              n = int(rate * dur)
              for i in range(n):
                  t = i / rate
                  v = amp * math.sin(2 * math.pi * 440 * t) * (0.6 + 0.4 * math.sin(2 * math.pi * 5 * t))
                  frames.append(int(max(-1, min(1, v)) * 32767))
          with wave.open("/tmp/e2e-tts.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              w.writeframes(b"".join(int(f).to_bytes(2, "little", signed=True) for f in frames))
          print("fixture frames=%d dur=%.2fs" % (len(frames), len(frames) / rate))
          PY
          ls -l /tmp/e2e-tts.wav

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator & end-to-end walkthrough
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -memory 3072
          emulator-boot-timeout: 600
          script: |
            APK_PATH=${APK_PATH:?no apk}
            adb install -r "$APK_PATH"
            pip3 install --quiet --user requests websockets pillow 2>/dev/null || pip3 install --quiet requests websockets pillow || true
            python3 -c "import websockets, requests; print('probe deps ok')" || exit 1
            XIAOMAN_TTS_PROVIDER=cmd XIAOMAN_TTS_CMD="cat /tmp/e2e-tts.wav" XIAOMAN_TTS_PORT=8903 TTS_CACHE_DIR=/tmp/e2e-tts-cache nohup python3 -u server/tts_server.py > /tmp/e2e-tts.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8903/health && break; sleep 1; done
            tail -5 /tmp/e2e-tts.log
            adb shell am start -n com.xiaoman.treehole/.MainActivity
            sleep 8
            for i in 1 2 3; do adb shell pidof com.xiaoman.treehole && break; adb shell am start -n com.xiaoman.treehole/.MainActivity || true; sleep 10; done
            adb shell pidof com.xiaoman.treehole || { echo "app not running"; adb logcat -d | tail -80; exit 1; }
            python3 scripts/emulator_e2e_walk.py || echo "[E2E] walkthrough exited nonzero"
            adb logcat -d | grep -E "AndroidRuntime|FATAL" | grep -i xiaoman | tail -20 || true

      - name: Dump TTS server log
        if: always()
        run: |
          echo "== tts log =="; tail -n 30 /tmp/e2e-tts.log 2>/dev/null || true
          ls -l /tmp/e2e-tts-cache 2>/dev/null | head || true

      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-walk
          path: |
            e2e_*.png
            e2e_walk_metrics.json
            e2e_dump.xml
            window_dump.xml
          if-no-files-found: warn
          retention-days: 14
