name: android

# 按需出包：只在手动触发 / tag 时跑，默认 debug（不签名），避免每次 push 烧 Gradle 分钟。
# 真机/模拟器验收不在云端做（AVD 类闸门留在本地，见 docs/ci-workflows.md）。
# 基线（main，2026-11-05）：debug APK ≈ 7-8 MiB（以 job summary 实测为准）。

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug（默认，不签名）或 release（未签名）"
        required: true
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      variant:
        description: "debug 或 release"
        required: false
        type: string
        default: debug

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: build-${{ inputs.variant || 'debug' }}-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VARIANT: ${{ inputs.variant || 'debug' }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=4"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Sync web assets into APK assets
        run: bash scripts/build_assets.sh

      - name: Assemble APK
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          if [ "$VARIANT" = "release" ]; then
            task="assembleRelease"
          else
            task="assembleDebug"
          fi
          ./android/gradlew -p android "$task" --no-daemon --stacktrace

      - name: Normalize APK + job summary
        run: |
          set -euo pipefail
          if [ "$VARIANT" = "release" ]; then
            apk=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            apk=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          [ -n "$apk" ] || { echo "未找到 APK"; exit 1; }
          mkdir -p artifact-staging
          cp "$apk" "artifact-staging/xiaoman-treehole-${VARIANT}.apk"
          bytes=$(stat -c%s "artifact-staging/xiaoman-treehole-${VARIANT}.apk")
          mib=$(awk "BEGIN{printf \"%.2f\", ${bytes}/1048576}")
          version=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | head -1 | cut -d'"' -f2)
          {
            echo "### android · ${VARIANT}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 产物 | xiaoman-treehole-${VARIANT}.apk |"
            echo "| 体积 | ${mib} MiB (${bytes} bytes) |"
            echo "| versionName | ${version} |"
            echo "| 签名 | 无（debug key / unsigned） |"
            echo "| JDK | 21 (temurin) · Android SDK 34 |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh artifact-staging/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoman-treehole-${{ env.VARIANT }}-apk
          path: artifact-staging/xiaoman-treehole-${{ env.VARIANT }}.apk
          if-no-files-found: error
          retention-days: 14
