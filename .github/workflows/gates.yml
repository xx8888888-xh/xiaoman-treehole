name: gates

# 手动一键跑全套：
#   ci（快闸门）+ e2e（核心四套 + 9 套额外 Playwright）+ android（APK），三条复用 workflow 并行。
# 定时巡检已收口到 nightly.yml（每日快闸门 + 周日全套慢闸门），这里不再挂 cron，避免同一套慢闸门重复计费。
#   GitHub 的 schedule 只在**默认分支**上生效，所以 nightly.yml 合并进 main 之后才会真正触发。
# 预算：一次全套 ≈ 22 分钟（runner 分钟按 job 相加），详见 docs/ci-workflows.md §6。

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      raf_seconds:
        description: "rAF 采样秒数"
        required: false
        default: "60"
      ui_scripts:
        description: "额外 9 套：all / none / 逗号分隔"
        required: false
        default: "all"

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  e2e:
    name: e2e
    uses: ./.github/workflows/e2e.yml
    with:
      core: "true"
      # schedule 事件没有 inputs → 退回 'all'，即每周全套慢闸门
      ui_scripts: ${{ inputs.ui_scripts || 'all' }}
      raf_seconds: ${{ inputs.raf_seconds || '60' }}

  android:
    name: android
    uses: ./.github/workflows/android.yml
    with:
      variant: debug
