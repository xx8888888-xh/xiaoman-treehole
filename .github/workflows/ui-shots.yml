name: ui-shots

# 第三轮视觉验收专用：云端渲染截图并回传 artifact。
# 本地一律不起 headless 浏览器（见 AGENT_SCOPE.md / w18）。
on:
  workflow_dispatch:

# 原 `push: feat/ui-r3`（paths web/**）已收窄为仅手动：分支合并进 main 后，
# 随手改一行 web 就烧一整套 Chromium 渲染不再划算（docs/ci-workflows.md §9 契约）。

permissions:
  contents: read

concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XIAOMAN_ALLOW_LOCAL_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # 第四轮要"改前/改后"同机对比：把 main 的 web/ 也拉下来，另起 8912。
      # 只比较布局，不比较本轮新增的表情/口型代码。
      - name: Checkout main (before-state)
        uses: actions/checkout@v4
        with:
          ref: main
          path: before
          fetch-depth: 1

      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 共享复合动作：版本只在 .github/actions/setup-playwright 里定义
      - uses: ./.github/actions/setup-playwright

      - name: Serve web/ statically
        run: |
          python -m http.server 8911 --bind 127.0.0.1 --directory web >/tmp/http.log 2>&1 &
          python -m http.server 8912 --bind 127.0.0.1 --directory before/web >/tmp/http-before.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8911/index.html >/dev/null && \
            curl -sf http://127.0.0.1:8912/index.html >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8911/index.html >/dev/null && echo "server ok (after)"
          curl -sf http://127.0.0.1:8912/index.html >/dev/null && echo "server ok (before)"

      - name: Render shots
        run: |
          mkdir -p shots
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          BASE = "http://127.0.0.1:8911/index.html"
          OUT = "shots"
          PHONE = {"width": 390, "height": 844}
          DESK = {"width": 1280, "height": 900}

          CFG = {"mode": "offline", "heartbeatOn": False, "tts": "off", "allowFreePersonal": False}
          MEM = {"称呼": "阿禾", "在意的人": "妈妈", "在意的事": "周三复诊", "最近": "在准备换工作"}

          def seed(page, theme="light", font="normal"):
              page.goto(BASE, wait_until="domcontentloaded")
              appearance = {"preset": "default"}
              if font == "large":
                  appearance = {"preset": "custom", "font": "large", "motion": True, "iconsGray": True, "flat": False}
              page.evaluate(
                  """([cfg, mem, theme, appearance]) => {
                      localStorage.clear();
                      localStorage.setItem("xiaoman_cfg", JSON.stringify(cfg));
                      localStorage.setItem("xiaoman_memory", JSON.stringify(mem));
                      localStorage.setItem("xiaoman_theme", theme);
                      localStorage.setItem("xiaoman_appearance_v1", JSON.stringify(appearance));
                      localStorage.setItem("xiaoman_told_v", "999");
                      // 截图里不要环境旁白（真实用户首启也会关掉一次）
                      sessionStorage.setItem("xiaoman_degrade_off", "1");
                      sessionStorage.setItem("xiaoman_voice_tip_off", "1");
                  }""",
                  [CFG, MEM, theme, appearance],
              )
              page.reload(wait_until="domcontentloaded")

          def settle(page):
              page.wait_for_timeout(2600)   # 等 Live2D 首帧或降级卡出现
              page.wait_for_timeout(400)

          def shot(page, name):
              page.screenshot(path=os.path.join(OUT, name + ".png"), full_page=False)
              print("shot", name)

          def open_drawer(page, btn):
              page.click("#" + btn)
              page.wait_for_timeout(600)

          def shot_bottom(page, panel, name):
              """把面板滚到最底再截，验证长页面（关于区 / 清空记忆）的真实排布"""
              page.evaluate(
                  """(sel) => {
                      const el = document.querySelector(sel);
                      if (el) el.scrollTop = el.scrollHeight;
                  }""",
                  panel,
              )
              page.wait_for_timeout(260)
              shot(page, name)

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--mute-audio"])

              for theme in ("light", "dark"):
                  ctx = browser.new_context(viewport=PHONE, device_scale_factor=2, locale="zh-CN")
                  page = ctx.new_page()
                  seed(page, theme)
                  settle(page)
                  shot(page, f"01-home-empty-{theme}")

                  open_drawer(page, "settingsBtn")
                  shot(page, f"02-settings-{theme}")
                  shot_bottom(page, "#settingsModal .modal-panel", f"07-settings-bottom-{theme}")
                  page.click("#settingsClose")
                  page.wait_for_timeout(300)

                  open_drawer(page, "memoryBtn")
                  shot(page, f"03-memory-{theme}")
                  shot_bottom(page, "#memoryDrawer .drawer-panel", f"08-memory-bottom-{theme}")
                  page.click("#memoryClose")
                  page.wait_for_timeout(300)

                  # 聊一句：离线兜底回复，只为了让页面出现真实气泡层级
                  page.fill("#textInput", "今天有点累，但还撑得住。")
                  page.click("#sendBtn")
                  page.wait_for_function(
                      "() => document.querySelectorAll('.bubble').length >= 2",
                      timeout=15000,
                  )
                  page.wait_for_timeout(1200)
                  shot(page, f"04-chat-{theme}")
                  ctx.close()

              # 桌面宽屏
              ctx = browser.new_context(viewport=DESK, device_scale_factor=1, locale="zh-CN")
              page = ctx.new_page()
              seed(page, "light")
              settle(page)
              page.fill("#textInput", "今天有点累，但还撑得住。")
              page.click("#sendBtn")
              page.wait_for_function("() => document.querySelectorAll('.bubble').length >= 2", timeout=15000)
              page.wait_for_timeout(1200)
              shot(page, "05-desktop-chat-light")
              ctx.close()

              # 大字号
              ctx = browser.new_context(viewport=PHONE, device_scale_factor=2, locale="zh-CN")
              page = ctx.new_page()
              seed(page, "light", font="large")
              settle(page)
              shot(page, "06-large-font-empty-light")
              ctx.close()

              browser.close()

          with open(os.path.join(OUT, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(
                  sorted(
                      ({"file": n, "bytes": os.path.getsize(os.path.join(OUT, n))}
                       for n in os.listdir(OUT) if n.endswith(".png")),
                      key=lambda item: item["file"],
                  ),
                  f,
                  ensure_ascii=False,
                  indent=2,
              )
          PY

      # 第四轮：浮窗三尺寸、表情最小集、竖/横屏改前改后，全部同机渲染
      - name: Render R4 shots
        run: |
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          AFTER = "http://127.0.0.1:8911/index.html"
          BEFORE = "http://127.0.0.1:8912/index.html"
          PET = "http://127.0.0.1:8911/pet.html"
          OUT = "shots"
          METRICS = {}

          CFG = {"mode": "offline", "heartbeatOn": False, "tts": "off", "allowFreePersonal": False}
          MEM = {"称呼": "阿禾", "在意的人": "妈妈", "在意的事": "周三复诊", "最近": "在准备换工作"}
          LONG_TIP = "今天降温了，出门记得把围巾带上；回来的时候我给你留了热水，别急着做别的。"

          SEED_JS = """([cfg, mem, theme, appearance]) => {
              localStorage.clear();
              localStorage.setItem("xiaoman_cfg", JSON.stringify(cfg));
              localStorage.setItem("xiaoman_memory", JSON.stringify(mem));
              localStorage.setItem("xiaoman_theme", theme);
              localStorage.setItem("xiaoman_appearance_v1", JSON.stringify(appearance));
              localStorage.setItem("xiaoman_told_v", "999");
              sessionStorage.setItem("xiaoman_degrade_off", "1");
              sessionStorage.setItem("xiaoman_voice_tip_off", "1");
          }"""

          def seed(page, base, theme="light", font="normal"):
              page.goto(base, wait_until="domcontentloaded")
              appearance = {"preset": "default"}
              if font == "large":
                  appearance = {"preset": "custom", "font": "large", "motion": True, "iconsGray": True, "flat": False}
              page.evaluate(SEED_JS, [CFG, MEM, theme, appearance])
              page.reload(wait_until="domcontentloaded")

          def settle(page):
              page.wait_for_timeout(2800)
              page.wait_for_timeout(500)

          def shot(page, name):
              page.screenshot(path=os.path.join(OUT, name + ".png"))
              print("shot", name)

          MAIN_METRICS_JS = """() => {
              const rect = (el) => {
                  if (!el) return null;
                  const b = el.getBoundingClientRect();
                  return {x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width),
                          h: Math.round(b.height), bottom: Math.round(b.bottom), right: Math.round(b.right)};
              };
              const stage = document.querySelector("#stage");
              const input = document.querySelector(".inputbar");
              const chat = document.querySelector("#chatScroll");
              const app = document.querySelector("#app");
              const ib = rect(input);
              return {
                  viewport: {w: innerWidth, h: innerHeight},
                  app: rect(app),
                  stage: rect(stage),
                  stageRatio: +(stage.getBoundingClientRect().height / innerHeight).toFixed(3),
                  chat: rect(chat),
                  input: ib,
                  inputVisible: ib.y >= -0.5 && ib.bottom <= innerHeight + 0.5,
                  inputBottomGap: Math.round(innerHeight - ib.bottom),
                  mode: window.__stageMode || null,
                  tier: window.__stageTier || null,
                  fallback: stage.classList.contains("is-fallback")
              };
          }"""

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--mute-audio"])

              # ---------- 竖屏 / 横屏，改前（main）与改后 ----------
              for label, base, vp, name in [
                  ("portrait-before", BEFORE, {"width": 390, "height": 844}, "41-portrait-before-light"),
                  ("portrait-after", AFTER, {"width": 390, "height": 844}, "40-portrait-after-light"),
                  ("landscape-before", BEFORE, {"width": 844, "height": 390}, "43-landscape-before-light"),
                  ("landscape-after", AFTER, {"width": 844, "height": 390}, "42-landscape-after-light"),
              ]:
                  ctx = browser.new_context(viewport=vp, device_scale_factor=1, locale="zh-CN")
                  page = ctx.new_page()
                  seed(page, base)
                  settle(page)
                  page.fill("#textInput", "今天有点累，但还撑得住。")
                  page.click("#sendBtn")
                  page.wait_for_function("() => document.querySelectorAll('.bubble').length >= 2", timeout=15000)
                  page.wait_for_timeout(1200)
                  shot(page, name)
                  METRICS[label] = page.evaluate(MAIN_METRICS_JS)
                  ctx.close()

              # ---------- 浮窗三尺寸（140×180 竖向极小 / 180×180 方形 / 240×160 横向宽） ----------
              PET_JS = """() => {
                  const rect = (el) => {
                      if (!el) return null;
                      const b = el.getBoundingClientRect();
                      return {x: +b.x.toFixed(1), y: +b.y.toFixed(1), w: +b.width.toFixed(1),
                              h: +b.height.toFixed(1), bottom: +b.bottom.toFixed(1)};
                  };
                  const tip = document.querySelector("#petTip");
                  const menu = document.querySelector("#petMenu");
                  const stage = document.querySelector("#petStage");
                  const cv = document.querySelector("#petStage canvas");
                  const cs = getComputedStyle(tip);
                  const fontPx = parseFloat(cs.fontSize) || 13;
                  const lhPx = parseFloat(cs.lineHeight) || fontPx * 1.35;
                  const cr = cv ? cv.getBoundingClientRect() : null;
                  const head = cr ? {
                      x: cr.x + (349 / 1235) * cr.width,
                      y: cr.y,
                      w: (540 / 1235) * cr.width,
                      h: (550 / 2841) * cr.height
                  } : null;
                  let visible = 0;
                  if (head) {
                      const ix = Math.max(0, Math.min(innerWidth, head.x + head.w) - Math.max(0, head.x));
                      const iy = Math.max(0, Math.min(innerHeight, head.y + head.h) - Math.max(0, head.y));
                      visible = (ix * iy) / (head.w * head.h);
                  }
                  const tr = rect(tip);
                  return {
                      viewport: {w: innerWidth, h: innerHeight},
                      tip: {
                          rect: tr,
                          hidden: tip.classList.contains("hidden"),
                          fontPx,
                          lineHeightPx: +lhPx.toFixed(1),
                          linesShown: Math.round((tip.clientHeight - parseFloat(cs.paddingTop || 0)
                                                   - parseFloat(cs.paddingBottom || 0)) / lhPx),
                          lineClamp: cs.webkitLineClamp || null,
                          textLen: tip.textContent.length,
                          charsPerLine: +((tip.clientWidth - parseFloat(cs.paddingLeft || 0)
                                           - parseFloat(cs.paddingRight || 0)) / fontPx).toFixed(1),
                          clipped: tip.scrollHeight > tip.clientHeight + 1,
                          coverRatio: +(tip.clientHeight / innerHeight).toFixed(3),
                      },
                      menu: rect(menu),
                      menuVisible: !menu.classList.contains("hidden"),
                      stage: rect(stage),
                      canvas: rect(cv),
                      head: head ? {x: +head.x.toFixed(1), y: +head.y.toFixed(1),
                                    w: +head.w.toFixed(1), h: +head.h.toFixed(1)} : null,
                      headVisibleRatio: +visible.toFixed(3),
                      headHeightRatio: head ? +(head.h / innerHeight).toFixed(3) : 0,
                      headWidthRatio: head ? +(head.w / innerWidth).toFixed(3) : 0,
                      mode: window.__stageMode || null,
                      fallback: stage.classList.contains("is-fallback")
                  };
              }"""

              for w, h in [(140, 180), (180, 180), (240, 160)]:
                  ctx = browser.new_context(viewport={"width": w, "height": h}, device_scale_factor=2, locale="zh-CN")
                  page = ctx.new_page()
                  seed(page, PET)
                  settle(page)
                  page.evaluate("(t) => window.__pet && window.__pet.tip(t)", LONG_TIP)
                  page.wait_for_timeout(300)
                  name = "20-pet-%dx%d" % (w, h)
                  shot(page, name)
                  METRICS[name] = page.evaluate(PET_JS)
                  # 菜单与气泡互斥：单独截一张，验证按钮在窄窗里不裁切
                  page.evaluate("() => window.__pet && window.__pet.menu(true)")
                  page.wait_for_timeout(250)
                  menu_name = "21-pet-%dx%d-menu" % (w, h)
                  shot(page, menu_name)
                  METRICS[menu_name] = page.evaluate(PET_JS)
                  ctx.close()

              # ---------- 表情最小集：同机同角度裁舞台 ----------
              ctx = browser.new_context(viewport={"width": 390, "height": 844}, device_scale_factor=2, locale="zh-CN")
              page = ctx.new_page()
              seed(page, AFTER)
              settle(page)
              EXPR = ["happy", "tired", "flat", "surprised", "neutral"]
              METRICS["expressions"] = {}
              for emo in EXPR:
                  page.evaluate("(n) => window.Stage && window.Stage.setEmotion(n)", emo)
                  page.wait_for_timeout(550)
                  box = page.locator("#stage").bounding_box()
                  name = "3%d-stage-%s" % (EXPR.index(emo), emo)
                  page.screenshot(path=os.path.join(OUT, name + ".png"), clip=box)
                  print("shot", name)
                  METRICS["expressions"][emo] = page.evaluate(
                      """() => ({
                          mode: window.__stageMode || null,
                          tier: window.__stageTier || null,
                          fallback: document.querySelector("#stage").classList.contains("is-fallback"),
                          mood: (document.querySelector("#moodText") || {}).textContent || null
                      })"""
                  )
              ctx.close()

              browser.close()

          with open(os.path.join(OUT, "metrics.json"), "w", encoding="utf-8") as f:
              json.dump(METRICS, f, ensure_ascii=False, indent=2)

          with open(os.path.join(OUT, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(
                  sorted(
                      ({"file": n, "bytes": os.path.getsize(os.path.join(OUT, n))}
                       for n in os.listdir(OUT) if n.endswith(".png")),
                      key=lambda item: item["file"],
                  ),
                  f, ensure_ascii=False, indent=2,
              )
          PY

      # 第五轮：暗色浮窗对比度、flat/neutral 像素差、首音节包络延迟
      # 首轮 CI 卡在 apt-get update（>=8min 未返回）。延迟测量不需要真语音引擎：
      # 用合成 WAV（30ms 起音 + 三段音节包络）当 provider 输出，量的是
      # "点击 → fetch → decode → 首个非零包络帧" 的真实客户端链路。
      # 另起 8904 端口 + 120ms 假合成，量化服务端合成成本叠加后的总延迟。
      - name: Prepare TTS fixture (no apt)
        run: |
          python -m pip install --quiet pillow
          python3 - <<'PY'
          import math, struct, wave
          rate, dur = 22050, 2.2
          frames = []
          for i in range(int(rate * dur)):
              t = i / rate
              u = t % 0.36
              env = 0.0 if u < 0.02 else (1 - math.exp(-(u - 0.02) * 40))
              if u > 0.26:
                  env *= max(0.0, (0.34 - u) / 0.08)
              frames.append(int(12000 * env * math.sin(2 * math.pi * 220 * t)))
          with wave.open("/tmp/r5-tts.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              w.writeframes(b"".join(struct.pack("<h", v) for v in frames))
          print("fixture /tmp/r5-tts.wav")
          PY
          printf '#!/bin/sh\nsleep 0.12\ncat /tmp/r5-tts.wav\n' > /tmp/r5-tts-slow.sh
          chmod +x /tmp/r5-tts-slow.sh

      - name: Start TTS servers (fast 8903 / +120ms 8904)
        run: |
          XIAOMAN_TTS_PROVIDER=cmd XIAOMAN_TTS_CMD="cat /tmp/r5-tts.wav" XIAOMAN_TTS_PORT=8903 \
            nohup python3 server/tts_server.py >/tmp/tts-fast.log 2>&1 &
          XIAOMAN_TTS_PROVIDER=cmd XIAOMAN_TTS_CMD="/tmp/r5-tts-slow.sh" XIAOMAN_TTS_PORT=8904 \
            nohup python3 server/tts_server.py >/tmp/tts-slow.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8903/health >/dev/null && curl -sf http://127.0.0.1:8904/health >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8903/health; echo
          curl -sf http://127.0.0.1:8904/health; echo

      - name: Render R5 shots
        run: |
          python -u - <<'PY'
          import json, os, statistics
          from PIL import Image, ImageChops, ImageOps
          from playwright.sync_api import sync_playwright

          AFTER = "http://127.0.0.1:8911/index.html"
          BEFORE = "http://127.0.0.1:8912/index.html"
          PET = "http://127.0.0.1:8911/pet.html"
          OUT = "shots"
          M = {}

          CFG = {"mode": "offline", "heartbeatOn": False, "tts": "off", "allowFreePersonal": False}
          def cfg_tts(server):
              return {"mode": "offline", "heartbeatOn": False, "tts": "server",
                      "ttsServer": server, "allowFreePersonal": False}
          MEM = {"称呼": "阿禾", "在意的人": "妈妈", "在意的事": "周三复诊", "最近": "在准备换工作"}
          LONG_TIP = "今天降温了，出门记得把围巾带上；回来的时候我给你留了热水，别急着做别的。"

          SEED_JS = """([cfg, mem, theme, appearance]) => {
              localStorage.clear();
              localStorage.setItem("xiaoman_cfg", JSON.stringify(cfg));
              localStorage.setItem("xiaoman_memory", JSON.stringify(mem));
              localStorage.setItem("xiaoman_theme", theme);
              localStorage.setItem("xiaoman_appearance_v1", JSON.stringify(appearance));
              localStorage.setItem("xiaoman_told_v", "999");
              sessionStorage.setItem("xiaoman_degrade_off", "1");
              sessionStorage.setItem("xiaoman_voice_tip_off", "1");
          }"""

          def seed(page, base, cfg=CFG, theme="light"):
              page.goto(base, wait_until="domcontentloaded")
              page.evaluate(SEED_JS, [cfg, MEM, theme, {"preset": "default"}])
              page.reload(wait_until="domcontentloaded")

          def shot(page, name, clip=None):
              page.screenshot(path=os.path.join(OUT, name + ".png"), clip=clip)
              print("shot", name)

          # ---------- 3) 暗色浮窗：三档尺寸 + WCAG 对比度 ----------
          DARK_JS = """() => {
              const rgb = (s) => {
                  const m = String(s || "").match(/rgba?\\(([^)]+)\\)/);
                  if (!m) return null;
                  return m[1].split(",").slice(0, 3).map((v) => parseFloat(v));
              };
              const lum = (c) => {
                  if (!c) return 0;
                  const a = c.map((v) => {
                      const x = v / 255;
                      return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
                  });
                  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
              };
              const ratio = (fg, bg) => {
                  const L1 = lum(rgb(fg)), L2 = lum(rgb(bg));
                  const hi = Math.max(L1, L2), lo = Math.min(L1, L2);
                  return +((hi + 0.05) / (lo + 0.05)).toFixed(2);
              };
              const tip = document.querySelector("#petTip");
              const cs = getComputedStyle(tip);
              const btn = document.querySelector("#petMenu button");
              const bs = getComputedStyle(btn);
              const menu = getComputedStyle(document.querySelector("#petMenu"));
              return {
                  dark: matchMedia("(prefers-color-scheme: dark)").matches,
                  tip: {color: cs.color, bg: cs.backgroundColor, border: cs.borderTopColor,
                        borderPx: cs.borderTopWidth, shadow: cs.boxShadow,
                        textContrast: ratio(cs.color, cs.backgroundColor),
                        borderContrast: ratio(cs.borderTopColor, cs.backgroundColor),
                        fontPx: parseFloat(cs.fontSize),
                        lines: +(tip.clientHeight / (parseFloat(cs.lineHeight) || 1)).toFixed(1),
                        clipped: tip.scrollHeight > tip.clientHeight + 1},
                  menuBtn: {color: bs.color, bg: bs.backgroundColor, border: bs.borderTopColor,
                            textContrast: ratio(bs.color, bs.backgroundColor),
                            borderContrast: ratio(bs.borderTopColor, bs.backgroundColor),
                            shadow: menu.boxShadow},
                  headVisibleRatio: (() => {
                      const c = document.querySelector("#petStage canvas");
                      if (!c) return 0;
                      const b = c.getBoundingClientRect();
                      const h = {x: b.x + (349 / 1235) * b.width, y: b.y,
                                 w: (540 / 1235) * b.width, h: (550 / 2841) * b.height};
                      const ix = Math.max(0, Math.min(innerWidth, h.x + h.w) - Math.max(0, h.x));
                      const iy = Math.max(0, Math.min(innerHeight, h.y + h.h) - Math.max(0, h.y));
                      return +((ix * iy) / (h.w * h.h)).toFixed(3);
                  })()
              };
          }"""

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--mute-audio",
                                               "--autoplay-policy=no-user-gesture-required"])

              for w, h in [(140, 180), (180, 180), (240, 160)]:
                  ctx = browser.new_context(viewport={"width": w, "height": h},
                                            device_scale_factor=2, locale="zh-CN",
                                            color_scheme="dark")
                  page = ctx.new_page()
                  seed(page, PET)
                  page.wait_for_timeout(3200)
                  page.evaluate("(t) => window.__pet && window.__pet.tip(t)", LONG_TIP)
                  page.wait_for_timeout(300)
                  name = "60-pet-dark-%dx%d" % (w, h)
                  shot(page, name)
                  M[name] = page.evaluate(DARK_JS)
                  page.evaluate("() => window.__pet && window.__pet.menu(true)")
                  page.wait_for_timeout(250)
                  shot(page, "61-pet-dark-%dx%d-menu" % (w, h))
                  ctx.close()

              # ---------- 2) flat vs neutral：同角度裁切 + 像素差 + 关键点 ----------
              ctx = browser.new_context(viewport={"width": 390, "height": 844},
                                        device_scale_factor=2, locale="zh-CN")
              page = ctx.new_page()
              seed(page, AFTER)
              page.wait_for_timeout(3600)

              geo = page.evaluate("""() => {
                  const s = document.querySelector("#stage").getBoundingClientRect();
                  const c = document.querySelector("#petStage canvas") ||
                            document.querySelector("#stage canvas");
                  const b = c.getBoundingClientRect();
                  return {stage: {x: s.x, y: s.y, w: s.width, h: s.height},
                          canvas: {dx: b.x - s.x, dy: b.y - s.y, w: b.width, h: b.height},
                          dpr: devicePixelRatio || 1};
              }""")
              box = page.locator("#stage").bounding_box()
              MANIFEST_JS = """() => {
                  const m = window.PUPPET_MANIFEST;
                  const h = (g, n) => (m.layers[g] && m.layers[g][n] && m.layers[g][n].h) || null;
                  return {
                      emotions: m.emotions,
                      eyeOpenH: h("eye_l", "open"), eyeHalfH: h("eye_l", "half"),
                      mouthClosedH: h("mouth", "closed"), mouthXsH: h("mouth", "open_xs"),
                      mouthLevels: (m.layers.mouthLevels || []).length
                  };
              }"""
              FACE = {}
              for code, emo in [("50", "neutral"), ("51", "flat"), ("52", "tired")]:
                  page.evaluate("() => window.Stage && window.Stage._poseForShot()")
                  page.evaluate("(n) => window.Stage && window.Stage.setEmotion(n)", emo)
                  page.wait_for_timeout(900)
                  shot(page, "%s-face-%s" % (code, emo), clip=box)
                  FACE[emo] = {
                      "state": page.evaluate("() => window.Stage && window.Stage._faceState()"),
                  }
              M["face"] = {"manifest": page.evaluate(MANIFEST_JS), "states": FACE,
                           "crop": {"stage": geo["stage"], "canvas": geo["canvas"],
                                    "dpr": geo["dpr"]}}
              ctx.close()

              # 像素差：同机同角度两张 2x 裁图；阈值 10/255 滤掉抗锯齿噪声
              a = Image.open(os.path.join(OUT, "50-face-neutral.png")).convert("RGB")
              b = Image.open(os.path.join(OUT, "51-face-flat.png")).convert("RGB")
              d = ImageChops.difference(a, b)
              r, g, bl = d.split()
              mx = ImageChops.lighter(ImageChops.lighter(r, g), bl)
              mask = Image.eval(mx, lambda v: 255 if v > 10 else 0)
              total = mask.width * mask.height
              changed = sum(1 for v in mask.getdata() if v)
              bbox = mask.getbbox()
              cg = geo["canvas"]
              dpr = geo["dpr"]
              head = {"x": (cg["dx"] + (349 / 1235) * cg["w"]) * dpr,
                      "y": cg["dy"] * dpr,
                      "w": (540 / 1235) * cg["w"] * dpr,
                      "h": (550 / 2841) * cg["h"] * dpr}
              def band(y0, y1):
                  crop = mask.crop((0, int(head["y"] + y0 * head["h"]),
                                    mask.width, int(head["y"] + y1 * head["h"])))
                  bb = crop.getbbox()
                  cnt = sum(1 for v in crop.getdata() if v)
                  return {"changed": cnt, "bbox": bb,
                          "bboxH": (bb[3] - bb[1]) if bb else 0}
              M["face_diff"] = {
                  "size": [mask.width, mask.height],
                  "changedPx": changed,
                  "changedRatio": round(changed / total, 4),
                  "bbox": bbox,
                  "headBox": {k: round(v, 1) for k, v in head.items()},
                  "eyeBand": band(0.47, 0.72),
                  "mouthBand": band(0.74, 0.86),
                  "threshold": 10
              }
              # 放大差异图，作为肉眼证据
              ImageOps.autocontrast(mx).save(os.path.join(OUT, "53-face-diff.png"))

              # ---------- 4) 首音节延迟：点击 → 首个非零包络帧 ----------
              LAT = """() => new Promise((resolve) => {
                  const t0 = performance.now();
                  const provider = window.TTS ? TTS.provider() : "none";
                  let done = false;
                  const finish = (why) => {
                      if (done) return;
                      done = true;
                      resolve({why, provider, totalMs: +(performance.now() - t0).toFixed(1),
                               timing: (window.TTS && TTS._lastTiming) ? TTS._lastTiming() : null});
                  };
                  TTS.speak("今天降温了，出门记得带围巾。",
                            (lv) => { if (lv >= 0.12) finish("first-nonzero"); },
                            () => finish("end"));
                  setTimeout(() => finish("timeout"), 12000);
              })"""

              def latency(base, tag, texts, server):
                  rows = []
                  for text in texts:
                      ctx = browser.new_context(viewport={"width": 390, "height": 844},
                                                device_scale_factor=1, locale="zh-CN")
                      page = ctx.new_page()
                      seed(page, base, cfg=cfg_tts(server))
                      page.wait_for_timeout(900)
                      r = page.evaluate(
                          LAT.replace("今天降温了，出门记得带围巾。", text))
                      page.evaluate("() => window.TTS && TTS.stop()")
                      rows.append(r)
                      ctx.close()
                  m = {"tag": tag, "runs": rows}
                  vals = [x["totalMs"] for x in rows if x["why"] == "first-nonzero"]
                  m["medianMs"] = round(statistics.median(vals), 1) if vals else None
                  # 分段中位数（毫秒，相对 speak() 入口）
                  seg = {"preDecode": [], "decode": [], "play": [], "envReady": [], "firstFrame": []}
                  for x in rows:
                      t = x.get("timing") or {}
                      if not t.get("speakAt"):
                          continue
                      if t.get("decodeStartAt"):
                          seg["preDecode"].append(t["decodeStartAt"] - t["speakAt"])
                      if t.get("envReadyAt", 0) > 0 and t.get("decodeStartAt"):
                          seg["decode"].append(t["envReadyAt"] - t["decodeStartAt"])
                      if t.get("playAt"):
                          seg["play"].append(t["playAt"] - t["fetchEndAt"])
                      if t.get("envReadyAt", 0) > 0:
                          seg["envReady"].append(t["envReadyAt"] - t["speakAt"])
                      if t.get("firstNonZeroAt"):
                          seg["firstFrame"].append(t["firstNonZeroAt"] - t["speakAt"])
                  m["segmentsMedianMs"] = {k: (round(statistics.median(v), 1) if v else None)
                                           for k, v in seg.items()}
                  return m

              TEXTS = ["今天降温了，出门记得带围巾。",
                       "我把热水放在桌上了，你慢慢来。",
                       "不用急着回我，先把自己照顾好。"]
              M["latency_before"] = latency(BEFORE, "R4 顺序解码", TEXTS, "http://127.0.0.1:8903")
              M["latency_after"] = latency(AFTER, "R5 并行解码", TEXTS, "http://127.0.0.1:8903")
              M["latency_before_slow"] = latency(BEFORE, "R4 顺序解码 +120ms 服务端", TEXTS, "http://127.0.0.1:8904")
              M["latency_after_slow"] = latency(AFTER, "R5 并行解码 +120ms 服务端", TEXTS, "http://127.0.0.1:8904")

              browser.close()

          with open(os.path.join(OUT, "metrics-r5.json"), "w", encoding="utf-8") as f:
              json.dump(M, f, ensure_ascii=False, indent=2)
          print(json.dumps({k: (v.get("medianMs") if isinstance(v, dict) and "medianMs" in v else "ok")
                            for k, v in M.items()}, ensure_ascii=False))
          PY

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ steps.sha.outputs.short }}
          path: shots/
          retention-days: 7
