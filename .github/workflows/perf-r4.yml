name: perf-r4

# 第四轮性能验收（PERF_R4）：只采样、不设门槛。
# 触发：仅手动（workflow_dispatch）。
# 服务：本 worktree 的 web/ 静态站（8911）+ server/mock_api.py（8912，AI_MODE=mock）；
#       不起 TTS（provider=none，全程静音），不复用 8901-8903。
# 浏览器：Playwright Chromium headless + --mute-audio；本地不跑（browser_guard 硬闸门）。

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      only:
        description: "只跑某几项（load,memory；留空=全跑）"
        required: false
        default: ""
      tag:
        description: "样本标签（before / after）"
        required: false
        default: ""
      repeat:
        description: "load 每档重复次数（1x/4x/开场白各跑几次，默认 5）"
        required: false
        default: "5"

concurrency:
  group: perf-r4-${{ github.ref }}
  cancel-in-progress: false

env:
  AI_MODE: mock
  XIAOMAN_HOST: 127.0.0.1
  XIAOMAN_WEB_PORT: "8911"
  XIAOMAN_MOCK_PORT: "8912"
  XIAOMAN_TTS_PROVIDER: none
  PYTHONUNBUFFERED: "1"

jobs:
  perf:
    name: perf-r4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 共享复合动作：版本只在 .github/actions/setup-playwright 里定义
      - uses: ./.github/actions/setup-playwright

      - name: Start web + mock
        run: |
          set -euo pipefail
          mkdir -p artifacts/perf data/sessions data/tts
          nohup python -m http.server 8911 --bind 127.0.0.1 --directory web > artifacts/web.log 2>&1 &
          nohup python server/mock_api.py > artifacts/mock.log 2>&1 &
          for i in $(seq 1 60); do
            ok=1
            curl -sf "http://127.0.0.1:8911/index.html" >/dev/null || ok=0
            curl -sf "http://127.0.0.1:8912/health" >/dev/null || ok=0
            if [ "$ok" = "1" ]; then echo "services ready after $((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "services not ready"; tail -40 artifacts/*.log; exit 1

      - name: Measure
        run: |
          set -euo pipefail
          REPEAT="${{ inputs.repeat }}"
          python scripts/perf_r4.py \
            --out artifacts/perf/r4.json \
            --out-r6 artifacts/perf/r6.json \
            --repeat "${REPEAT:-5}" \
            --only "${{ inputs.only }}" \
            --tag "${{ inputs.tag }}"

      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p6, p4 = "artifacts/perf/r6.json", "artifacts/perf/r4.json"
          p = p6 if os.path.exists(p6) else p4
          if not os.path.exists(p):
              print("no result file"); raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          print("file:", p, "tag:", d.get("tag"), "repeat:", d.get("repeat"),
                "sha:", d.get("runner", {}).get("GITHUB_SHA"), "at:", d.get("generatedAt"))
          load = d.get("load") or {}
          dist = d.get("distributions") or load.get("distributions") or {}

          def fmt(s):
              if not s or not s.get("n"):
                  return "n=0"
              return ("median=%s min=%s max=%s mean=%s p95=%s stdev=%s n=%s"
                      % (s["median"], s["min"], s["max"], s["mean"], s["p95"],
                         s["stdev"], s["n"]))

          # ① 分布（1x / 4x / 开场白各 repeat 次）
          for label in ("1x", "4x"):
              s = ((dist.get("metrics") or {}).get("firstSendMs") or {}).get(label)
              if s:
                  print("[r6] firstSend %s %s raw=%s"
                        % (label, fmt(s), json.dumps(s.get("values"))))
          gm = (dist.get("greet") or {})
          for key in ("greetLandedMs", "greetDoneMs"):
              if gm.get(key):
                  print("[r6] %s %s" % (key, fmt(gm[key])))
          # ② 阶段拆分：firstSendMs 的四段 + 观测侧轮询残差，中位数与 4x-1x 差值
          segs = dist.get("segments") or {}
          keys = ("inputToSendMs", "sendSyncMs", "domCommitMs", "awaitFirstRenderMs",
                  "pollResidualMs", "inPageTotalMs")
          for label in ("1x", "4x"):
              row = segs.get(label) or {}
              if row:
                  print("[r6] segments %s %s" % (label, " ".join(
                      "%s=%s" % (k, (row.get(k) or {}).get("median")) for k in keys)))
          for k in keys:
              a = ((segs.get("1x") or {}).get(k) or {}).get("median")
              b = ((segs.get("4x") or {}).get(k) or {}).get("median")
              if a is not None and b is not None:
                  print("[r6] delta(4x-1x) %s=%+.1fms" % (k, b - a))
          # ③ 首屏旁证 + 长任务（沿用 r4 字段）
          m1 = load.get("median") or {}
          if m1:
              print("[summary] 1x inputReady=%sms LCP=%sms FCP=%sms longMax=%sms over50=%s"
                    % (m1["inputReadyMs"], m1["lcp"], m1["fcp"], m1["longMax"],
                       m1["longOver50"]))
          tm = (load.get("throttled") or {}).get("median") or {}
          if tm:
              print("[summary] %sx inputReady=%sms LCP=%sms longMax=%sms over50Max=%sms"
                    % (load["throttled"].get("rate"), tm["inputReadyMs"], tm["lcp"],
                       tm["longMax"], tm["longOver50Max"]))
          # ④ 长会话（r6 只带 summary，r4 带全部明细）
          sm = (d.get("memory") or {}).get("summary") or {}
          if sm:
              pg = sm.get("pager") or {}
              print("[summary] memory heap %s→%sMB growth=%sMB warmup=%s dom=%s→%s held=%s"
                    % (sm.get("heapStartMB"), sm.get("heapEndMB"), sm.get("heapGrowthMB"),
                       sm.get("warmup"), sm.get("domNodesStart"), sm.get("domNodesEnd"),
                       pg.get("held")))
              print("[summary] memory marks:", json.dumps(sm.get("marks"), ensure_ascii=False))
              print("[summary] memory pager held/evicted/total/rendered=%s phase2GrowthMB=%s"
                    % (json.dumps(pg, ensure_ascii=False), sm.get("phase2GrowthMB")))
              print("[summary] paging flags=%s moves=%s calls=%s"
                    % (json.dumps(sm.get("paging") or {}, ensure_ascii=False),
                       sm.get("pagingMoves"), sm.get("pagingCalls")))
              cold = (d.get("memory") or {}).get("cold") or {}
              if cold:
                  print("[summary] memory cold(warmup%s) heap %s→%sMB growth=%s"
                        % (cold.get("warmup") or 40, cold.get("heapStartMB"),
                           cold.get("heapEndMB"), cold.get("heapGrowthMB")))
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-r4-${{ steps.sha.outputs.short }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  perf-gate:
    name: perf-gate
    # 独立门：只比对 R6 基线（docs/perf_baseline_r6.json），不改 perf job 的通过条件。
    runs-on: ubuntu-latest
    needs: perf
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baseline may only tighten
        run: |
          set -uo pipefail
          PREV=$(mktemp)
          if git show origin/main:docs/perf_baseline_r6.json > "$PREV" 2>/dev/null; then
            python scripts/perf_gate.py --baseline docs/perf_baseline_r6.json \
              --verify-monotonic-against "$PREV"
          else
            echo "BASELINE: SKIP (origin/main 尚无该基线文件)"
          fi

      - name: Unit test gate rules
        run: python scripts/test_perf_gate.py

      - name: Download perf artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: perf-r4-*
          path: gate-artifacts

      - name: Evaluate R6 baseline gate
        run: |
          set -uo pipefail
          PERF=$(find gate-artifacts -name r6.json 2>/dev/null | head -1)
          if [ -z "$PERF" ]; then
            echo "GATE: SKIP (perf job 未上传 r6.json，无法比对基线)"
            exit 0
          fi
          ARGS=(--perf "$PERF")
          case "${{ inputs.only }}" in
            ""|*load*) ARGS+=(--require-sections firstsend) ;;
          esac
          python scripts/perf_gate.py "${ARGS[@]}" --json-out gate-artifacts/perf_gate.json | tee gate-artifacts/perf_gate.txt

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-result
          path: |
            gate-artifacts/perf_gate.json
            gate-artifacts/perf_gate.txt
          if-no-files-found: ignore
          retention-days: 7
