name: perf-r4

# 第四轮性能验收（PERF_R4）：只采样、不设门槛。
# 触发：仅手动（workflow_dispatch）。
# 服务：本 worktree 的 web/ 静态站（8911）+ server/mock_api.py（8912，AI_MODE=mock）；
#       不起 TTS（provider=none，全程静音），不复用 8901-8903。
# 浏览器：Playwright Chromium headless + --mute-audio；本地不跑（browser_guard 硬闸门）。

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      only:
        description: "只跑某几项（load,memory；留空=全跑）"
        required: false
        default: ""
      tag:
        description: "样本标签（before / after）"
        required: false
        default: ""

concurrency:
  group: perf-r4-${{ github.ref }}
  cancel-in-progress: false

env:
  AI_MODE: mock
  XIAOMAN_HOST: 127.0.0.1
  XIAOMAN_WEB_PORT: "8911"
  XIAOMAN_MOCK_PORT: "8912"
  XIAOMAN_TTS_PROVIDER: none
  PYTHONUNBUFFERED: "1"

jobs:
  perf:
    name: perf-r4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 共享复合动作：版本只在 .github/actions/setup-playwright 里定义
      - uses: ./.github/actions/setup-playwright

      - name: Start web + mock
        run: |
          set -euo pipefail
          mkdir -p artifacts/perf data/sessions data/tts
          nohup python -m http.server 8911 --bind 127.0.0.1 --directory web > artifacts/web.log 2>&1 &
          nohup python server/mock_api.py > artifacts/mock.log 2>&1 &
          for i in $(seq 1 60); do
            ok=1
            curl -sf "http://127.0.0.1:8911/index.html" >/dev/null || ok=0
            curl -sf "http://127.0.0.1:8912/health" >/dev/null || ok=0
            if [ "$ok" = "1" ]; then echo "services ready after $((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "services not ready"; tail -40 artifacts/*.log; exit 1

      - name: Measure
        run: |
          set -euo pipefail
          python scripts/perf_r4.py \
            --out artifacts/perf/r4.json \
            --only "${{ inputs.only }}" \
            --tag "${{ inputs.tag }}"

      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p = "artifacts/perf/r4.json"
          if not os.path.exists(p):
              print("no result file"); raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          print("tag:", d.get("tag"), "sha:", d.get("runner", {}).get("GITHUB_SHA"),
                "at:", d.get("generatedAt"))
          load = d.get("load") or {}
          m1 = load.get("median") or {}
          if m1:
              print("[summary] firstSend 1x median=%sms (runs=%s) inputReady=%sms LCP=%sms FCP=%sms longMax=%sms over50=%s"
                    % (m1["firstSendMs"], [r["firstSendMs"] for r in load.get("runs") or []],
                       m1["inputReadyMs"], m1["lcp"], m1["fcp"], m1["longMax"], m1["longOver50"]))
          tm = (load.get("throttled") or {}).get("median") or {}
          if tm:
              print("[summary] firstSend %sx median=%sms (runs=%s) inputReady=%sms LCP=%sms longMax=%sms over50Max=%sms"
                    % (load["throttled"].get("rate"), tm["firstSendMs"],
                       [r["firstSendMs"] for r in load["throttled"].get("runs") or []],
                       tm["inputReadyMs"], tm["lcp"], tm["longMax"], tm["longOver50Max"]))
          gm = (load.get("greet") or {}).get("median") or {}
          if gm:
              print("[summary] greet@%sx landed=%sms done=%sms played=%s skipped=%s records=%s"
                    % (gm.get("throttle"), gm.get("greetLandedMs"), gm.get("greetDoneMs"),
                       gm.get("played"), gm.get("skipped"), gm.get("records")))
              print("[summary] greet runs:",
                    json.dumps([{"landed": r.get("greetLandedMs"), "done": r.get("greetDoneMs"),
                                 "played": r.get("played"), "records": r.get("records")}
                                for r in (load["greet"].get("runs") or [])], ensure_ascii=False))
          sm = (d.get("memory") or {}).get("summary") or {}
          if sm:
              pg = sm.get("pager") or {}
              print("[summary] memory heap %s→%sMB growth=%sMB warmup=%s dom=%s→%s held=%s"
                    % (sm.get("heapStartMB"), sm.get("heapEndMB"), sm.get("heapGrowthMB"),
                       sm.get("warmup"), sm.get("domNodesStart"), sm.get("domNodesEnd"),
                       pg.get("held")))
              print("[summary] memory marks:", json.dumps(sm.get("marks"), ensure_ascii=False))
              print("[summary] memory pager held/evicted/total/rendered=%s phase2GrowthMB=%s"
                    % (json.dumps(pg, ensure_ascii=False), sm.get("phase2GrowthMB")))
              print("[summary] paging flags=%s moves=%s calls=%s"
                    % (json.dumps(sm.get("paging") or {}, ensure_ascii=False),
                       sm.get("pagingMoves"), sm.get("pagingCalls")))
              cold = (d.get("memory") or {}).get("cold") or {}
              if cold:
                  print("[summary] memory cold(warmup%s) heap %s→%sMB growth=%s"
                        % (cold.get("warmup") or 40, cold.get("heapStartMB"),
                           cold.get("heapEndMB"), cold.get("heapGrowthMB")))
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-r4-${{ steps.sha.outputs.short }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
