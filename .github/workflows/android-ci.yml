name: android-ci

# 小满树洞 CI/CD · 出包 + 模拟器真机级验证 + UI 截图
# 触发：push 到 main 或 zhiqiu/**（知秋的分支）/ PR / 手动。公开仓库免费（Linux runner）。
# 多AI协同分支策略：知秋=zhiqiu/**，另一协作者用其自己的分支，main 保持稳定。
# 说明：GitHub ubuntu runner 自带 /dev/kvm，模拟器可硬件加速启动（约1-2分钟冷启）。
# 前提：仓库根放本项目（含 android/ 与 scripts/build_apk.sh）。
#
# 2026-11-05 起改为「仅手动」的 legacy 流水线：日常出包走 android.yml（快、无签名），
# 模拟器 smoke 属真机/AVD 类闸门，默认留在本地（见 docs/ci-workflows.md），
# 需要云端复现时再手动触发本 workflow。

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle 并发/内存：覆盖 gradle.properties 的沙箱限流值
  GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx2g"
  # 签名密钥（由 GitHub Secrets 注入，base64 编码的 keystore）
  ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      keystore_present: ${{ steps.keystore_check.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            /opt/hostedtoolcache/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android/gradle.properties') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Decode keystore for release signing
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV

      - name: Sync web assets into android assets/www (single source of truth)
        run: bash scripts/build_assets.sh

      - name: Build Debug APK (Gradle preferred, fallback to script)
        run: |
          if [ -f android/gradlew ]; then
            (cd android && ./gradlew assembleDebug --no-daemon)
          else
            bash scripts/build_apk.sh
          fi

      - name: Normalize APK to fixed path
        run: |
          APK=$(find . -name "*.apk" -path "*debug*" 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "No debug APK produced"; exit 1; }
          mkdir -p artifact-staging
          cp "$APK" artifact-staging/xiaoman-treehole.apk
          ls -la artifact-staging/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoman-treehole-apk
          path: artifact-staging/xiaoman-treehole.apk
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    runs-on: ubuntu-latest
    needs: build-apk
    if: needs.build-apk.outputs.keystore_present == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            /opt/hostedtoolcache/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android/gradle.properties') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Decode keystore for release signing
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV

      - name: Sync web assets into android assets/www (single source of truth)
        run: bash scripts/build_assets.sh

      - name: Build Release APK
        run: |
          if [ -f android/gradlew ]; then
            (cd android && ./gradlew assembleRelease --no-daemon)
          else
            echo "Gradle wrapper missing; cannot build release via script (no release signing support)"
            exit 1
          fi

      - name: Verify Release APK signature
        run: |
          apksigner verify android/app/build/outputs/apk/release/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoman-treehole-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - uses: actions/checkout@v4

      - name: Download Debug APK from build-apk
        uses: actions/download-artifact@v4
        with:
          name: xiaoman-treehole-apk
          path: downloaded-apk/

      - name: Locate downloaded APK (diagnostics)
        run: |
          echo "== downloaded tree =="
          find downloaded-apk -type f -printf "%p (%s bytes)\n" 2>/dev/null || ls -R downloaded-apk
          APK_PATH=$(find . -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then echo "ERROR: no APK found after download"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV" 

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator & smoke test with screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -memory 3072 -no-audio
          emulator-boot-timeout: 600
          script: |
            # Find the actual APK file (supports both Gradle and script output names)
            APK_PATH=${APK_PATH:?no apk located in earlier step}
            echo "Installing APK: $APK_PATH"
            adb install -r "$APK_PATH"

            # Start app
            adb shell am start -n com.xiaoman.treehole/.MainActivity
            sleep 8

            # Verify process is alive (retry x3, single line — emulator-runner executes script line-by-line!)
            for i in 1 2 3; do adb shell pidof com.xiaoman.treehole && { echo "process alive (attempt $i)"; break; }; echo "attempt $i: relaunching"; adb shell am start -n com.xiaoman.treehole/.MainActivity || true; sleep 10; done
            adb shell pidof com.xiaoman.treehole || { echo "ERROR: App process not found after 3 attempts — crash evidence follows"; adb logcat -d | rg -i "xiaoman|FATAL|AndroidRuntime|lowmemorykiller" | tail -100 || adb logcat -d | tail -200 || true; exit 1; }

            # Check for FATAL in logcat
            adb logcat -d | grep -i "AndroidRuntime" | grep -qi "xiaoman" && { echo "ERROR: App FATAL crash in logcat"; adb logcat -d | rg -A15 "FATAL EXCEPTION" | tail -40; exit 1; } || true

            # Screenshot: home screen
            adb exec-out screencap -p > emulator_01_home.png

            # ---- 主界面聊天冒烟（P0 修复）----
            # 旧脚本 `tap 140 615` / `tap 296 615` 是照截图猜的坐标，实测打在舞台空白区：
            # textInput 一直空、sendBtn 一直 disabled、消息根本没发出去，而且没有任何断言，
            # 流水线照样"绿"，等于什么都没验。现在坐标从 WebView DOM 真实盒子动态取，
            # 并且硬断言：textInput 非空 / sendBtn 不再 disabled / #messages 出现新气泡 /
            # logcat 有 [probe] msg me + msg them。任一条不成立直接 exit 1。
            pip3 install --quiet --user requests websockets 2>/dev/null || pip3 install --quiet requests websockets || true
            python3 -c "import websockets, requests; print('cdp deps ok')" || { echo "ERROR: requests/websockets unavailable"; exit 1; }
            python3 scripts/emulator_chat_check.py || { echo "ERROR: main chat check failed"; exit 1; }

            # ---- NoisyGuard 注册（ADB/dumpsys 级证据，不靠 JVM 单测）----
            # TtsController 构造时就 registerReceiver(ACTION_AUDIO_BECOMING_NOISY)；
            # 这里从 dumpsys 的 Registered Receivers 里核实它确实挂在本进程上，
            # 再用 logcat [probe] noisy-receiver registered 交叉印证。
            python3 scripts/emulator_noisy_check.py || { echo "ERROR: NoisyGuard registration check failed"; exit 1; }

            # Poke Live2D
            adb shell input tap 160 220
            sleep 3

            # Screenshot: poke
            adb exec-out screencap -p > emulator_03_poke.png

            # ---- 悬浮窗完整交互验收（P2-4b v3：授权→球→拖动→展开→聊天→收起→关闭，产出 emulator_04~09） ----
            # v3 三通道证据：dumpsys window（窗口级）+ PIL 像素基线差分（像素级）+ logcat probe（链路级）。
            # uiautomator dump 对 TYPE_APPLICATION_OVERLAY 有盲区（run 38853971176 实锤：球已渲染但 dump 无节点）。
            pip3 install --quiet --user pillow 2>/dev/null || pip3 install --quiet pillow || true
            python3 -c "import PIL; print('PIL', PIL.__version__)" || { echo "ERROR: pillow unavailable"; exit 1; }
            python3 scripts/emulator_float_check.py || { echo "ERROR: float window check failed"; exit 1; }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: emulator_0*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI dump on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uiautomator-dump
          path: |
            window_dump.xml
            float_dumpsys.txt
            noisy_dumpsys.txt
          if-no-files-found: ignore
          retention-days: 7

  # Web 端测试门禁（scripts/ 审计 D54）：四套脚本失败即非零退出，接入后失败可传播
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 共享复合动作：版本只在 .github/actions/setup-playwright 里定义
      - uses: ./.github/actions/setup-playwright

      - name: Install ffmpeg (TTS verify dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Start local services (mock 8902 / tts 8903 / web 8901)
        # CI 没有凭据管理器、也不该让 UI 用例依赖外部模型：统一用 AI_MODE=mock，
        # 保证「记忆落库 / 提醒 / 心跳」等断言可复现（真模型只在 quick 的契约测试外单独验）
        env:
          AI_MODE: mock
        run: bash scripts/dev_up.sh

      - name: Run web test suite
        env:
          AI_MODE: mock
        run: |
          set -e
          python3 scripts/test_mock_api.py
          python3 scripts/test_mock_api.py      # 幂等复跑：连续两次应一致通过
          python3 scripts/test_lifeline_ui.py
          python3 scripts/test_onboarding.py
          python3 scripts/test_e2e.py
          python3 scripts/verify_tts.py

      - name: Stop local services
        if: always()
        run: bash scripts/dev_down.sh || true

      - name: Upload logs & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-logs
          path: |
            logs/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7