name: android-ci

# 小满树洞 CI/CD · 出包 + 模拟器真机级验证 + UI 截图
# 触发：push 到 main / 手动。公开仓库免费（Linux runner）。
# 说明：GitHub ubuntu runner 自带 /dev/kvm，模拟器可硬件加速启动（约1-2分钟冷启）。
# 前提：仓库根放本项目（含 android/ 与 scripts/build_apk.sh）。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      # 首选 gradle；仓库未带 wrapper 时自动落到本项目手工流水线（零依赖，约2分钟）
      - name: Build APK
        run: |
          if [ -f android/gradlew ]; then
            (cd android && ./gradlew assembleDebug --no-daemon)
          else
            bash scripts/build_apk.sh
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoman-treehole-apk
          path: android/app/build/outputs/apk/debug/*.apk

  emulator-smoke:
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK (artifact for install)
        run: |
          if [ -f android/gradlew ]; then
            (cd android && ./gradlew assembleDebug --no-daemon)
          else
            bash scripts/build_apk.sh
          fi

      - name: Run emulator & smoke test with screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install -r android/app/build/outputs/apk/debug/xiaoman-treehole-v0.3-debug.apk
            # 兼容权限兜底（未声明则容忍失败）；若弹权限页则点 CONTINUE
            adb shell pm grant com.xiaoman.treehole android.permission.READ_PHONE_STATE 2>/dev/null || true
            adb shell pm grant com.xiaoman.treehole android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true
            adb shell am start -n com.xiaoman.treehole/.MainActivity
            sleep 5
            adb shell input tap 296 726   # 权限页 CONTINUE（若在）
            sleep 8
            adb exec-out screencap -p > emulator_01_home.png
            adb shell input tap 140 615   # 输入框（320x733 视口）
            sleep 1
            adb shell input text "jin tian hao lei a"
            sleep 1
            adb shell input tap 296 615   # 发送按钮
            sleep 8
            adb exec-out screencap -p > emulator_02_chat.png
            adb shell input tap 160 220   # 戳 Live2D 角色
            sleep 3
            adb exec-out screencap -p > emulator_03_poke.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: emulator_0*.png
