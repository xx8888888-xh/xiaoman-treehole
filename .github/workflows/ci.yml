name: ci

# 快闸门（每次 push / PR）：Node 单测 + Biome + Python pytest + 发布物一致性 + 旧 WebView CSS 语法扫描。
# 刻意不碰 Docker、不跑浏览器、不启动模拟器——这些属于 e2e.yml / android.yml / 本地。
# 基线（main，2026-11-05）：node 181 passed；pytest 145 passed + 19 subtests；biome 0 error。
# 分支基线可能不同（如 feat/data-completeness 为 node 192 / pytest 153），因此这里只跑不做数字断言。

permissions:
  contents: read

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'zhiqiu/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  node:
    name: node-tests-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        # 仓库已提交 web/package-lock.json；若后续出现 lock 缺失/不同步，
        # 这里会直接红，提示改用 npm install 并补 lock（不静默降级）。
        run: npm ci

      - name: node:test
        run: npm test

      - name: Biome lint (0 error)
        run: npm run lint

  python:
    name: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test deps
        # 测试本体只用标准库；pytest/pytest-subtests 仅用于汇总与子用例计数。
        run: python -m pip install --upgrade pip pytest pytest-subtests

      - name: Syntax compile (server + scripts)
        run: python -m compileall -q server scripts

      - name: Sync assets + verify (web ↔ android assets/www)
        # 同一真源两处消费：先按 build_assets.sh 生成发布物，再逐文件 sha256 校验。
        run: |
          bash scripts/build_assets.sh
          python scripts/verify_assets.py

      - name: pytest
        run: python -m pytest server/tests -q

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ci · python"
            echo "- 运行命令：\`python -m pytest server/tests -q\`"
            echo "- 发布物：\`python scripts/verify_assets.py\`（web ↔ assets/www）"
          } >> "$GITHUB_STEP_SUMMARY"

  css-webview-compat:
    name: css-webview-compat
    # 旧 WebView（Chrome 83 基线）CSS 语法防回归：静态扫描，不启浏览器/模拟器。
    # 只输出 [CSS-COMPAT] 清单（MUST-FIX / KNOWN-OK），默认 exit 0 不判红；
    # 待 MUST-FIX 清零并稳定后，再决定是否加 --strict 收紧。
    # 事故背景与已接受项登记见 docs/android-audio/ANDROID_AUDIO_VERIFIABILITY.md §3.7。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan legacy WebView CSS syntax
        run: python scripts/css_webview_compat.py

  python-scripts:
    name: python-scripts (${{ matrix.script }})
    # 这两个脚本是纯 Python（G3 用 node 直调 mock_engine.js），不需要浏览器；
    # 但必须有一个 mock 对话服务。这里直接 `python server/mock_api.py` 起进程，
    # 不引入 Docker，保持 ci.yml 的快闸门属性。
    # 基线（main，2026-11-05）：test_mock_api 12/12；test_memory_recall 152/152。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        script: [test_mock_api, test_memory_recall]
    env:
      AI_MODE: mock
      XIAOMAN_HOST: 127.0.0.1
      XIAOMAN_MOCK_PORT: "8902"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (test_memory_recall G3 离线引擎)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start mock service (no Docker)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nohup python server/mock_api.py > artifacts/mock.log 2>&1 &
          echo $! > /tmp/xiaoman_mock.pid
          for i in $(seq 1 30); do
            if curl -sf "http://${XIAOMAN_HOST}:${XIAOMAN_MOCK_PORT}/health" >/dev/null; then
              echo "mock ready on ${XIAOMAN_HOST}:${XIAOMAN_MOCK_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "mock 启动超时"
          cat artifacts/mock.log
          exit 1

      - name: Run ${{ matrix.script }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python "scripts/${{ matrix.script }}.py" 2>&1 | tee "artifacts/${{ matrix.script }}.log"

      - name: Stop mock service
        if: always()
        run: |
          if [ -f /tmp/xiaoman_mock.pid ]; then
            kill "$(cat /tmp/xiaoman_mock.pid)" 2>/dev/null || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.script }}-log
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ci · ${{ matrix.script }}"
            grep -hE "\[SUMMARY\]|[0-9]+/[0-9]+ passed" "artifacts/${{ matrix.script }}.log" 2>/dev/null || echo "(未运行/无汇总)"
          } >> "$GITHUB_STEP_SUMMARY"
