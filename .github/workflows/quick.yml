name: quick

# 轻量云端回归：不依赖 Android SDK / 模拟器 / Docker，每次 push 都能 1-2 分钟内出结果。
# 真正的出包与模拟器验收在 android-ci.yml 中（耗时 3-4 分钟，含 KVM 模拟器）。

permissions:
  contents: read

on:
  push:
    branches: [main, 'feat/**', 'zhiqiu/**', 'fix/**', 'model/**', 'integration/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-fast:
    name: python-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法编译检查（server + scripts）
        run: python -m compileall -q server scripts

      - name: Python 单测（同一步内起 mock 服务）
        # 关键：GitHub Actions 每个 step 结束会清理后台进程，不能"上一步起服务、
        # 下一步跑测试"（会 0/8 Connection refused）。起服务、等待、测试、收尸放一起。
        env:
          AI_MODE: mock
        run: |
          python server/mock_api.py > /tmp/mock.log 2>&1 &
          MPID=$!
          trap 'kill $MPID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:8902/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then echo "mock 启动失败"; tail -30 /tmp/mock.log; exit 1; fi
          echo "mock ready"
          python scripts/test_mock_api.py
          python scripts/test_memory_recall.py

      - name: 失败时输出服务日志
        if: failure()
        run: tail -50 /tmp/mock.log || true

  js-fast:
    name: js-fast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: node:test 单测
        run: npm test

      - name: Biome lint
        run: npm run lint
