# Sandbox-constrained defaults (low memory, single worker).
# CI overrides these via GRADLE_OPTS / -Dorg.gradle.workers.max=4 (see android-ci.yml).
org.gradle.jvmargs=-Xmx900m
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx600m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
# 本仓库路径含中文（D:\我的\编程\...），AGP 默认会因此拒绝构建；
# 实测 aapt2/d8/javac 对中文路径无问题，故显式关闭该路径检查。
android.overridePathCheck=true
