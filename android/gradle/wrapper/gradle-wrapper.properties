# Gradle 8.7（与 AGP 8.4.1 匹配，JDK 17+）。官方 https://services.gradle.org 会 302 到
# github.com Releases，部分网络（含本机）无法连 GitHub；改用华为云镜像，并用 distributionSha256Sum
# 锁定官方 zip 摘要（内容与官方完全一致，镜像仅换下载通道）。若需改回官方：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://repo.huaweicloud.com/gradle/gradle-8.7-bin.zip
distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d
networkTimeout=60000
retries=2
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
