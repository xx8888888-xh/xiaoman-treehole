# 小满树洞 · 三服务（前端静态站 8901 / mock+AI 代理 8902 / TTS 8903）
# 宿主机端口全部映射到 127.0.0.1（回环），容器内监听 0.0.0.0。
# 启动：docker compose up -d --build
name: treehole

x-common-env: &common-env
  AI_MODE: ${AI_MODE:-mock}
  AI_API_BASE: ${AI_API_BASE:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3.5-lightning:free}
  TTS_BASE: ${TTS_BASE:-http://127.0.0.1:8903}
  TTS_VOICE: ${TTS_VOICE:-zh-CN-XiaoyiNeural}
  # 默认不启用服务端合成（不内置云 TTS / 模型）；/tts 回 503，前端走系统 TTS。
  # 可选：cmd（外部本地 TTS 命令，见 XIAOMAN_TTS_CMD）、sherpa（自备模型）、
  # edge（在线免费女声，需用 --build-arg TTS_EDGE=1 重建镜像）
  XIAOMAN_TTS_PROVIDER: ${XIAOMAN_TTS_PROVIDER:-none}
  # 安卓壳：file:// 页面 Origin 是字面量 "null"；WebViewAssetLoader 域是
  # https://appassets.androidplatform.net。三者都必须在白名单里，否则 APK 内
  # 拉模型 / 调代理一律被 CORS 拦。
  XIAOMAN_ALLOW_ORIGINS: ${XIAOMAN_ALLOW_ORIGINS:-http://127.0.0.1:8901,null,https://appassets.androidplatform.net}

x-labels: &labels
  com.dsh.project: treehole

services:
  web:
    build:
      context: .
      target: runtime
      network: host
    image: treehole-web:local
    # 启动前强校验：
    #   1) 挂载的 assets/www 必须与工作树 web/ 逐文件一致（同一排除口径）；
    #   2) assets/www 必须与自身 ASSET_MANIFEST.json 逐文件 sha256/字节一致。
    # 任一不一致 → 拒绝启动并打印差异，避免 8901 对外提供过期 index.html/app.js。
    command:
      - sh
      - -c
      - "python /app/scripts/verify_assets.py --src /app/source-web --dst /app/web && python /app/scripts/verify_manifest.py --dir /app/web --manifest /app/web/ASSET_MANIFEST.json && exec python -m http.server 8901 --bind 0.0.0.0 --directory web"
    ports:
      - "127.0.0.1:8901:8901"
    # 运行期直接只读挂载唯一真源（assets/www），杜绝镜像里留旧副本造成漂移；
    # Dockerfile 的 COPY 保留给独立 `docker run` 场景。web/ 只用于启动前交叉校验，不对外服务。
    volumes:
      - ./android/app/src/main/assets/www:/app/web:ro
      - ./web:/app/source-web:ro
    environment:
      <<: *common-env
    labels: *labels
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8901/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mock:
    build:
      context: .
      target: runtime
      network: host
    image: treehole-mock:local
    command: ["python", "server/mock_api.py"]
    ports:
      - "127.0.0.1:8902:8902"
    environment:
      <<: *common-env
      XIAOMAN_DATA_DIR: /data/sessions
    volumes:
      - ./data/sessions:/data/sessions
    labels: *labels
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8902/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  tts:
    build:
      context: .
      target: runtime
      network: host
    image: treehole-tts:local
    # TTS 与 web/mock 共用同一运行时（0 新增依赖）；provider 由环境变量决定
    command: ["python", "server/tts_server.py"]
    ports:
      - "127.0.0.1:8903:8903"
    environment:
      <<: *common-env
      TTS_CACHE_DIR: /data/tts
    volumes:
      - ./data/tts:/data/tts
    labels: *labels
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8903/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
